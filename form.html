<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Form Kerja Jepang - KOJAC</title>

<link rel="icon" href="assets/img/favicon.png">
<link rel="stylesheet" href="gaya.css">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>

<style>

/* ===== FORM STYLE ===== */
.form-container {
    max-width: 700px;
    margin: 2rem auto;
}

.form-card {
    background: #f9f9f9;
    padding: 2rem;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.form-card h2 {
    text-align: center;
    color: #c21010;
    margin-bottom: 1.5rem;
}

.form-group {
    margin-bottom: 1.2rem;
}

.form-group label {
    font-weight: 600;
    display: block;
    margin-bottom: 0.4rem;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 0.7rem;
    border-radius: 8px;
    border: 2px solid #ddd;
    font-family: 'Quicksand';
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    border-color: #c21010;
    outline: none;
}

/* Upload style */
.file-upload {
    border: 2px dashed #ddd;
    padding: 1rem;
    border-radius: 10px;
    text-align: center;
    cursor: pointer;
    transition: 0.2s;
}

.file-upload:hover {
    border-color: #c21010;
}

/* Button */
.btn-submit {
    width: 100%;
    padding: 1rem;
    border-radius: 999px;
    border: none;
    background: #c21010;
    color: white;
    font-weight: 700;
    cursor: pointer;
    margin-top: 1rem;
}

.btn-submit:hover {
    background: #a00d0d;
}

.note {
    font-size: 0.85rem;
    color: #666;
    margin-top: 0.3rem;
}

</style>
</head>

<body>

<!-- HEADER -->
<header class="navbar-container">
    <div class="nav-logo">
        <a href="index.html"><img src="assets/img/Logo kuuhaku.png"></a>
    </div>

    <nav class="nav-list">
        <ul>
            <li><a href="index.html">Beranda</a></li>
            <li><a href="kelas.html">Kelas</a></li>
            <li><a href="kontak.html">Kontak</a></li>
        </ul>
    </nav>

    <a href="https://siswa.kojac.id/auth" target="_blank">
        <button>Halaman Siswa</button>
    </a>
</header>

<!-- MAIN -->
<main>
<div class="form-container">

    <div class="profile-header">
        <h1>Form Pendaftaran Kerja Jepang</h1>
        <p>Isi data dengan lengkap untuk proses seleksi kerja ke Jepang</p>
    </div>

    <div class="form-card">

        <form id="jobForm">

            <!-- 1 -->
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" name="nama" required>
            </div>

            <!-- 2 -->
            <div class="form-group">
                <label>Tempat, Tanggal Lahir</label>
                <input type="text" name="ttl" placeholder="Contoh: Jakarta, 12 Januari 2000" required>
            </div>

            <!-- 3 -->
            <div class="form-group">
                <label>Umur</label>
                <input type="number" name="umur" required>
            </div>

            <!-- 4 -->
            <div class="form-group">
                <label>Alamat Saat Ini</label>
                <textarea name="alamat" rows="3" required></textarea>
            </div>

            <!-- 5 -->
            <div class="form-group">
                <label>Sertifikat Bahasa Jepang</label>
                <select name="sertifikat">
                    <option>Tidak Ada</option>
                    <option>JFT Basic A2</option>
                    <option>JLPT N5</option>
                    <option>JLPT N4</option>
                    <option>JLPT N3</option>
                    <option>JLPT N2</option>
                    <option>JLPT N1</option>
                </select>
            </div>

            <!-- 6 -->
            <div class="form-group">
                <label>Sertifikat SSW (Jika Ada)</label>
                <input type="text" name="ssw" placeholder="Contoh: Kaigo, Tokutei Ginou">
            </div>

            <!-- 7 -->
            <div class="form-group">
                <label>Upload Sertifikat Bahasa Jepang</label>
                <input type="file" name="file_jepang" required>
                <p class="note">Format: PDF / JPG / PNG</p>
            </div>

            <!-- 8 -->
            <div class="form-group">
                <label>Upload Sertifikat SSW (Opsional)</label>
                <input type="file" name="file_ssw">
            </div>

            <button type="submit" class="btn-submit">
                🚀 Kirim Data Sekarang
            </button>

        </form>

    </div>
</div>
</main>

<script>
document.getElementById("jobForm").addEventListener("submit", function(e){
    e.preventDefault();

    alert("Form siap dikirim (hubungkan ke backend dulu)");

});
</script>

</body>
</html>
